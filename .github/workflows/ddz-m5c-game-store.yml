name: M5c real TurboDB private Game ACK transaction

'on':
  pull_request:
    paths:
      - 'games/doudizhu/src/room_store_turbodb.c'
      - 'games/doudizhu/include/mygames/room_store.h'
      - 'games/doudizhu/src/ddz_match_checkpoint.c'
      - 'games/doudizhu/include/mygames/ddz_match_checkpoint.h'
      - 'tests/ddz_turbodb_game_commit_test.c'
      - 'games/doudizhu/src/ddz_game_owner.c'
      - 'games/doudizhu/include/mygames/ddz_game_owner.h'
      - 'tests/ddz_game_owner_integration_test.c'
      - 'CMakeLists.txt'
      - '.github/workflows/ddz-m5c-game-store.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygames-m5c-game-turbodb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-orm-commit:
    name: Real TurboDB SQLite WAL/FULL + M5c private Game ACK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore exact pinned Salts/CHttp/TurboDB Native SDKs without mono
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/restore-native-sdks.sh "$RUNNER_TEMP/mygames-sdk"
          # GITHUB_ENV exports TURBODB_ROOT to the NEXT step, not this one.
          test -f "$RUNNER_TEMP/mygames-sdk/turbodb/sdk/linux-x64/lib/turbodb/drivers/turbodb_driver_sqlite.so"

      - name: Configure genuine native TurboDB-backed Room+GameStore
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/game-store -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DMYGAMES_ENABLE_GATEWAY=OFF \
            -DMYGAMES_ENABLE_TURBODB=ON -DMYGAMES_ENABLE_FLOWIE=OFF \
            -DCMAKE_PREFIX_PATH="$SDK_PREFIX_PATH"
          cmake --build build/game-store --parallel 2 \
            --target mygames_game_owner_test mygames_game_store_test mygames_turbodb_store_test

      - name: Assert genuine installed ORM and SQLite driver closure
        shell: bash
        run: |
          set -euo pipefail
          ldd build/game-store/mygames_game_store_test | tee build/game-store/orm-ldd.txt
          ! grep -q 'not found' build/game-store/orm-ldd.txt
          test -f "$TURBODB_ROOT/lib/turbodb/drivers/turbodb_driver_sqlite.so"

      - name: Run real private Game ACK, rollback, replay, epoch and corrupt-image tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/game-store -C Release \
            --no-tests=error --output-on-failure --timeout 120 \
            -R '^mygames[.](game_owner|game_store|turbodb_store)$'

      - name: Repeat committed game and actual separate SQLite reopen
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/game-store -C Release \
            --no-tests=error --output-on-failure --timeout 120 \
            --repeat until-fail:5 -R '^mygames[.](game_owner|game_store)$'

      - name: Preserve exact physical datastore test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mygames-m5c-turbodb-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/game-store/orm-ldd.txt
            build/game-store/Testing/Temporary/LastTest.log

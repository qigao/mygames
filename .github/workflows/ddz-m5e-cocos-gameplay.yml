name: M5e Cocos Creator gameplay UI and protocol qualification

'on':
  pull_request:
    paths:
      - 'apps/cocos/assets/scripts/**'
      - 'apps/cocos/assets/scenes/**'
      - 'apps/cocos/assets/README.md'
      - 'tests/cocos_gameplay.test.mjs'
      - 'tests/cocos_scene.test.mjs'
      - 'tests/cocos_ts_syntax.test.mjs'
      - 'tests/protocol.test.mjs'
      - 'tests/game_socket.test.mjs'
      - 'apps/server/main.c'
      - 'scripts/ddz_m5d_ws_smoke.mjs'
      - '.github/workflows/ddz-m5e-cocos-gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygames-m5e-cocos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-cocos-protocol:
    name: Creator scene, live game protocol and private-hand tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript parser, no native Editor emulation
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Validate true Cocos scene graph and TypeScript/game model syntax
        run: >-
          node --experimental-strip-types --test
          tests/cocos_scene.test.mjs
          tests/cocos_ts_syntax.test.mjs
          tests/protocol.test.mjs
          tests/game_socket.test.mjs
          tests/cocos_gameplay.test.mjs
      - name: Repeat protocol and privacy/state recovery contract
        run: >-
          node --experimental-strip-types --test
          tests/cocos_gameplay.test.mjs
          tests/game_socket.test.mjs

  linux-c11-source:
    name: M5e C11 game/room wire compatibility / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build all real C11 Room and Game wire targets without external SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/m5e-core -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DMYGAMES_ENABLE_GATEWAY=OFF \
            -DMYGAMES_ENABLE_TURBODB=OFF -DMYGAMES_ENABLE_FLOWIE=OFF
          cmake --build build/m5e-core --parallel 2
      - name: Run all room/game native protocol CTests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/m5e-core -C Debug --no-tests=error \
            --output-on-failure --timeout 90
